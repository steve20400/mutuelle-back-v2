name: Build et demarrage du backend

# Verifie trois choses, entierement sur les serveurs de GitHub :
#   1. le projet compile avec le meme JDK que l'image Docker (Java 21),
#   2. l'application demarre reellement sur MySQL 8.4 (meme version que la
#      base Aiven de production) et Flyway applique
#      toutes les migrations de src/main/resources/db/migration,
#   3. l'image Docker se construit, ce qui est exactement ce que fait Render.
#
# Le diagnostic est recopie dans le resume de l'execution, lisible sans se
# connecter, ce qui evite d'avoir a ouvrir les journaux detailles.

on:
  workflow_dispatch:
  # Toutes les branches : chaque correction est verifiee sur sa propre branche
  # avant d'etre fusionnee dans main (que Render deploie automatiquement).
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  pull_request:

jobs:
  build-et-demarrage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mutuelle_ci
          MYSQL_USER: mutuelle_ci
          MYSQL_PASSWORD: mutuelle_ci
          MYSQL_ROOT_PASSWORD: racine_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pracine_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer le JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compiler le jar
        run: mvn -B -DskipTests package

      - name: Demarrer l'application sur MySQL
        id: demarrage
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: mutuelle_ci
          DB_USER: mutuelle_ci
          DB_PASSWORD: mutuelle_ci
        run: |
          java -jar target/*.jar > demarrage.log 2>&1 &
          echo $! > app.pid
          # Pas d'actuateur dans ce projet : /api/hello sert de sonde de sante.
          echo "Attente de /api/hello pendant 300 secondes au maximum"
          for i in $(seq 1 100); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/hello || true)
            if [ "$code" = "200" ]; then
              echo "resultat=demarree" >> "$GITHUB_OUTPUT"
              echo "duree=$((i * 3))" >> "$GITHUB_OUTPUT"
              echo "Application demarree apres environ $((i * 3)) secondes"
              exit 0
            fi
            if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
              echo "resultat=processus_mort" >> "$GITHUB_OUTPUT"
              echo "::error::Le processus Java s'est arrete avant de repondre"
              exit 1
            fi
            sleep 3
          done
          echo "resultat=delai_depasse" >> "$GITHUB_OUTPUT"
          echo "::error::/api/hello n'a pas repondu 200 en 300 secondes"
          exit 1

      - name: Tests de fumee sur les parcours corriges
        if: steps.demarrage.outputs.resultat == 'demarree'
        run: |
          API=http://localhost:8080
          echecs=0
          verifier() { # libelle, code attendu, code obtenu
            if [ "$2" = "$3" ]; then echo "OK      $1 ($3)"; else echo "ECHEC   $1 : attendu $2, obtenu $3"; echecs=$((echecs + 1)); fi
            echo "| $1 | $2 | $3 |" >> fumee.md
          }
          echo "| Verification | Attendu | Obtenu |" > fumee.md
          echo "|---|---|---|" >> fumee.md
          membre=$(curl -s -H 'Content-Type: application/json' \
            -d '{"nom":"Fumee","prenom":"Test","couriel":"fumee@ci.test","telephone":"699000001"}' $API/api/membres)
          id=$(echo "$membre" | jq -r '.id')
          verifier "creation d'un membre" "true" "$([ -n "$id" ] && [ "$id" != null ] && echo true || echo false)"
          # C1 : un membre cree pendant l'exercice en cours doit sa part d'inscription,
          # et ses statuts doivent decouler de ses dettes (plus de « non paye » a 0 FCFA)
          dette_ins=$(echo "$membre" | jq -r '.detteInscription')
          dette_sol=$(echo "$membre" | jq -r '.detteSolidarite')
          verifier "dette d'inscription positive" "true" "$(awk -v d="$dette_ins" 'BEGIN{print (d > 0) ? "true" : "false"}')"
          verifier "statut inscription coherent" "$(awk -v d="$dette_ins" 'BEGIN{print (d == 0) ? "true" : "false"}')" "$(echo "$membre" | jq -r '.inscriptionPayee')"
          verifier "statut solidarite coherent" "$(awk -v d="$dette_sol" 'BEGIN{print (d == 0) ? "true" : "false"}')" "$(echo "$membre" | jq -r '.solidaritePayee')"
          verifier "paiement de l'inscription" 201 "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "{\"membreId\":\"$id\",\"montant\":$dette_ins}" $API/api/versements/inscription)"
          # C8 : les listes de versements repondaient 500 des qu'elles n'etaient plus vides
          verifier "demande d'epargne" 201 "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "{\"membreId\":\"$id\",\"montant\":1000}" $API/api/versements/epargne)"
          verifier "historique du membre" 200 "$(curl -s -o /dev/null -w '%{http_code}' $API/api/versements/membre/$id)"
          verifier "tous les versements" 200 "$(curl -s -o /dev/null -w '%{http_code}' $API/api/versements)"
          verifier "versements d'epargne" 200 "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/versements?raison=epargne")"
          verifier "versements en attente" 200 "$(curl -s -o /dev/null -w '%{http_code}' $API/api/versements/en-attente)"
          { echo "## Tests de fumee"; echo; cat fumee.md; } >> "$GITHUB_STEP_SUMMARY"
          [ "$echecs" -eq 0 ] || { echo "::error::$echecs verification(s) en echec"; exit 1; }

      - name: Resume du demarrage
        if: always()
        run: |
          {
            echo "## Demarrage du backend sur MySQL 8.4"
            echo
            echo "- Resultat : \`${{ steps.demarrage.outputs.resultat }}\`"
            if [ -n "${{ steps.demarrage.outputs.duree }}" ]; then
              echo "- Duree : environ ${{ steps.demarrage.outputs.duree }} secondes"
            fi
            if [ -f demarrage.log ]; then
              echo "- Migrations Flyway : $(grep -oE 'Successfully applied [0-9]+ migrations?' demarrage.log | tail -1 || echo 'aucune ligne trouvee')"
              echo
              echo "### Dernieres lignes du journal"
              echo
              echo '```'
              grep -vE '^\s*(select|insert|update|delete|from|where|and|or|values|set|order|limit)\b|Hibernate:' demarrage.log | tail -60
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Arreter l'application
        if: always()
        run: |
          if [ -f app.pid ]; then kill "$(cat app.pid)" 2>/dev/null || true; fi

      - name: Construire l'image Docker
        run: docker build -t mutuelle-back-v2 .
